<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 予想サイト</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/2026_FIFA_World_Cup_Logo.svg/1200px-2026_FIFA_World_Cup_Logo.svg.png" 
             class="header-logo" 
             alt="FIFA World Cup 2026 Logo">
        <div class="header-title">
            <p class="header-main">FIFA World Cup 2026</p>
            <p class="header-sub">予想サイト</p>
        </div>
        <div class="header-actions" style="margin-left: auto; display: flex; gap: 10px;">
            <button id="copyUrlBtn" style="padding: 8px 12px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🔗 URLコピー</button>
            <button id="exportImgBtn" style="padding: 8px 12px; background: #16a34a; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">📷 画像保存</button>
        </div>
    </header>

    <main id="capture-area" style="padding: 20px; background-color: #f8fafc;">
        <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="tab-btn active" data-target="group-stage">グループステージ</button>
            <button class="tab-btn" data-target="tournament">決勝トーナメント</button>
        </div>

        <section id="group-stage" class="tab-content active">
            <h2>グループステージ予想</h2>
            <div id="groups-container">
                </div>
        </section>

        <section id="tournament" class="tab-content" style="display: none;">
            <h2>決勝トーナメント予想</h2>
            <div id="bracket-container">
                </div>
        </section>
    </main>

    <script src="app.js"></script>
    </body>
</html>
